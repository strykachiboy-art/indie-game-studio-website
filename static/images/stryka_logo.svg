<svg xmlns="http://www.w3.org/2000/svg" width="240" height="48" viewBox="0 0 240 48" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">StrykaMax logo</title>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#a3e635"/>
      <stop offset="1" stop-color="#65a30d"/>
    </linearGradient>
  </defs>
  <rect width="240" height="48" rx="8" fill="#0a0b10" />
  <text x="18" y="32" font-family="'Space Grotesk', sans-serif" font-size="22" fill="url(#g)">
    Stryka
  </text>
  <text x="118" y="32" font-family="'Inter', sans-serif" font-size="22" fill="#f4f4f0">
    Max
  </text>
  <!-- subtle pixel accents -->
  <rect x="196" y="10" width="6" height="6" fill="#65a30d" />
  <rect x="204" y="10" width="6" height="6" fill="#a3e635" />
</svg>
